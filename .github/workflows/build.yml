name: Build downloadable applications

on:
  workflow_dispatch:
    inputs:
      include_linux:
        description: Also package the Linux source download
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check PyInstaller==6.22.3
      - name: Verify Windows policy and interface
        run: python -m unittest discover -s tests -p "test_windows*.py" -v
      - name: Build Windows application
        run: python tools/build-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mute-Windows-x64
          path: release/Mute-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    if: ${{ inputs.include_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Package Linux source
        run: python tools/package-linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mute-Linux
          path: release/Mute-Linux.zip
          if-no-files-found: error
          retention-days: 14
